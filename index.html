    .card img { width: 100%; height: 135px; object-fit: cover; border-radius: 6px; display: block; background: #eee; }

    .card h3 { font-size: 14px; margin: 8px 0 4px; }
    .card .desc { font-size: 12px; color: #666; margin: 0 0 8px; }
    .card .old { text-decoration: line-through; color: #888; font-size: 12px; }
    .card .disc { color: #e44d26; font-size: 12px; font-weight: bold; margin-left: 5px; }
    .card .new { font-weight: bold; color: #b12704; font-size: 15px; margin: 4px 0 8px; }
    .card .add { background: #25D366; color: #fff; border: none; padding: 9px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 13px; }
    
    /* INSPECTION MODAL */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; padding: 15px; }
    .modal-box { background: #fff; border-radius: 12px; max-width: 420px; width: 100%; padding: 16px; position: relative; max-height: 90vh; overflow-y: auto; }

    .main-preview { width: 100%; height: 240px; object-fit: cover; border-radius: 8px; margin-top: 10px; background: #f9f9f9; }
    .thumbs { display: flex; gap: 8px; margin-top: 10px; justify-content: center; }
    .thumbs img { width: 65px; height: 65px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 2px solid transparent; opacity: 0.7; }
    .thumbs img.selected { border-color: #25D366; opacity: 1; }
    .modal-title { font-size: 18px; margin: 12px 0 4px; }
    .modal-specs { font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 10px; }
    .modal-price { font-size: 18px; font-weight: bold; color: #b12704; margin-bottom: 12px; }

</div>

<footer>

  Fast Delivery Across Kenya • Inspect Before Paying • Trusted by Thousands

<div id="cartBar">

  </div>
</div>

let cart = [];
let currentCat = 'all';

function renderProducts() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  products.forEach((p, index) => {
    const searchKeys = (p.name + " " + p.desc + " " + p.cat).toLowerCase();
    grid.innerHTML += `
      <div class="card" data-name="${searchKeys}" data-cat="${p.cat}">
        <div class="img-wrap" onclick="openInspect(${index})">
          <img src="${p.imgs[0]}" loading="lazy">
          <span class="inspect-badge">📷 ${p.imgs.length} Views</span>
        </div>
        <h3>${p.name}</h3>
        <p class="desc">${p.desc}</p>
        <p><span class="old">KSh ${p.oldPrice.toLocaleString()}</span> <span class="disc">${p.disc}</span></p>
        <p class="new">KSh ${p.price.toLocaleString()}</p>
        <button class="add" onclick="add('${p.name.replace(/'/g, "\\'")}', ${p.price})">🛒 ADD TO CART</button>
      </div>
    `;
  });
  filter();
}

function openInspect(index) {
  const p = products[index];
  document.getElementById('modalTitle').innerText = p.name;
  document.getElementById('modalSpecs').innerHTML = "• " + p.desc.replace(/, /g, "<br>• ") + "<br>• Genuine Quality • Pay on Delivery Available";
  document.getElementById('modalPrice').innerText = 'KSh ' + p.price.toLocaleString();
  
  const mainImg = document.getElementById('modalMainImg');
  mainImg.src = p.imgs[0];

  const thumbsDiv = document.getElementById('modalThumbs');
  thumbsDiv.innerHTML = '';
  p.imgs.forEach((imgUrl, i) => {
    const thumb = document.createElement('img');
    thumb.src = imgUrl;
    if (i === 0) thumb.classList.add('selected');
    thumb.onclick = function() {
      mainImg.src = imgUrl;
      document.querySelectorAll('.thumbs img').forEach(t => t.classList.remove('selected'));
      thumb.classList.add('selected');
    };
    thumbsDiv.appendChild(thumb);
  });

  document.getElementById('modalAddBtn').onclick = function() {
    add(p.name, p.price);
    document.getElementById('inspectModal').style.display = 'none';
  };

  document.getElementById('inspectModal').style.display = 'flex';
}

function closeModal(e) {
  if (e.target.id === 'inspectModal') {
    document.getElementById('inspectModal').style.display = 'none';
  }
}

function filter() {
  let q = document.getElementById('search').value.toLowerCase();
  let cards = document.querySelectorAll('.card');
  let count = 0;
  cards.forEach(c => {
    let name = c.getAttribute('data-name');
    let cat = c.getAttribute('data-cat');
    let show = (currentCat == 'all' || cat == currentCat) && name.includes(q);
    c.style.display = show ? 'flex' : 'none';
    if (show) count++;
  });
  document.getElementById('count').innerText = count;
}

function setCat(c, el) {
  currentCat = c;
  document.querySelectorAll('.cats button').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  filter();
}

function add(name, price) {
  cart.push({ name: name, price: price });
  updateCartUI();
}

function clearCart() {
  cart = [];
  updateCartUI();
}

function updateCartUI() {
  let total = cart.reduce((s, p) => s + p.price, 0);
  document.getElementById('cartText').innerText = 
    '🛒 Cart: ' + cart.length + ' items - KSh ' + total.toLocaleString();
}

function checkout() {
  if (cart.length == 0) { alert('Cart is empty'); return; }
  let total = cart.reduce((s, p) => s + p.price, 0);
  let itemsList = cart.map(p => "- " + p.name + " - KSh " + p.price.toLocaleString()).join("%0A");
  let msg = "Hello LANGAT SHOP, I want to order:%0A" + itemsList + "%0A%0A*Total: KSh " + total.toLocaleString() + "*";
  window.open("https://wa.me/254701416556?text=" + msg);
}

renderProducts();
</script>
