    function formatPrice(amountKsh) {
      const cfg = currencyRates[selectedCurrency] || currencyRates.KSh;
      const converted = amountKsh * cfg.rate;
      if (selectedCurrency === 'USD') return cfg.symbol + converted.toFixed(2);
      return cfg.symbol + Math.round(converted).toLocaleString();
    }

    function changeCurrency(curr) {
      selectedCurrency = curr;
      document.getElementById('currencySelector').value = curr;
      renderStoreContent();
    }

    function switchTab(tab) {
      currentTab = tab;
      if (tab === 'account') {
        document.getElementById('mainStoreView').classList.add('hidden');
        document.getElementById('mainAccountView').classList.remove('hidden');
        renderAccountView();
      } else if (tab === 'home' || tab === 'category') {
        document.getElementById('mainAccountView').classList.add('hidden');
        document.getElementById('mainStoreView').classList.remove('hidden');
        renderStoreContent();
      } else if (tab === 'message') {
        alert('Customer support live chat via WhatsApp / In-app messaging is active.');
      }
    }

    function renderCategoryTabs() {
      const nav = document.getElementById('categoryTabs');
      nav.innerHTML = categories.map(cat => `
        <button onclick="filterCat('${cat}')" class="font-bold text-xs pb-1 transition ${cat === 'Hot' ? 'text-orange-500 border-b-2 border-orange-500' : 'text-gray-300 hover:text-white'}">
          ${cat}
        </button>
      `).join('');
    }

    function filterCat(cat) {
      alert(`Filtering category: ${cat}`);
    }

      renderCategoryTabs();
      const container = document.getElementById('mainStoreView');
      const query = document.getElementById('searchInput').value.toLowerCase();

      const items = catalog.filter(p => p.name.toLowerCase().includes(query));

      container.innerHTML = `

            </div>
            <span class="text-xs bg-black/30 px-2 py-1 rounded-lg font-bold">⚡ Flash Sale</span>

        </div>

        <div class="grid grid-cols-3 gap-2 bg-white p-2 rounded-xl border border-gray-200">
          <div onclick="filterCat('Phones')" class="bg-orange-50 border border-orange-200 p-2 rounded-lg text-center cursor-pointer">
            <img src="${catalog[4].image}" class="h-14 mx-auto object-contain mb-1" />
            <p class="text-[10px] font-black text-gray-800">Phones & ACCs ></p>

            <p class="text-[11px] font-black text-orange-600">KSh 3,959</p>
          </div>
          <div onclick="filterCat('Shoes')" class="bg-orange-50 border border-orange-200 p-2 rounded-lg text-center cursor-pointer">
            <img src="${catalog[6].image}" class="h-14 mx-auto object-contain mb-1" />

            const isPicked = pickedProductIds.includes(product.id);
            const cardBg = isPicked ? 'bg-white border-gray-200' : 'bg-white border-amber-300 ring-1 ring-amber-200';

              ? `<span class="absolute top-2 left-2 bg-gray-800 text-white text-[9px] font-black px-1.5 py-0.5 rounded">✓ PICKED</span>`

    // =========================================================================
    // CART & PICKED HIGHLIGHT HANDLER
    // =========================================================================
    function addToCart(productId) {
      const product = catalog.find(p => p.id === productId);
      const size = document.getElementById(`size-${productId}`).value;
      const color = document.getElementById(`color-${productId}`).value;
      const pack = document.getElementById(`pack-${productId}`).value;
      const qty = parseInt(document.getElementById(`qty-${productId}`).value) || 1;

      cart.push({
        id: product.id,
        name: product.name,
        image: product.image,
        size, color, pack, qty,
        unitPrice: product.price,
        totalPrice: product.price * qty
      });

      if (!pickedProductIds.includes(productId)) {
        pickedProductIds.push(productId);
      }

      updateCartCounters();
      renderStoreContent();
      openCartDrawer();
    }

    function updateCartCounters() {
      document.getElementById('floatingCartCount').innerText = cart.length;
      document.getElementById('bottomNavCartCount').innerText = cart.length;
    }

    function removeFromCart(index) {
      const removed = cart[index];
      cart.splice(index, 1);
      if (removed && !cart.some(i => i.id === removed.id)) {
        pickedProductIds = pickedProductIds.filter(id => id !== removed.id);
      }
      updateCartCounters();
      renderStoreContent();
      openCartDrawer();
    }

    // =========================================================================
    // CART DRAWER & PAYSTACK CHECKOUT
    // =========================================================================
    function openCartDrawer() {
      const drawer = document.getElementById('cartDrawer');
      const title = document.getElementById('drawerTitle');
      const body = document.getElementById('drawerBody');
      drawer.classList.remove('hidden');

      const totalKsh = cart.reduce((sum, i) => sum + i.totalPrice, 0);
      const depositKsh = Math.round(totalKsh * 0.3);
      const balanceKsh = totalKsh - depositKsh;

      title.innerText = `Shopping Cart (${cart.length})`;
      if (cart.length === 0) {
        body.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center text-center text-gray-500">
            <p class="text-sm font-bold">Your cart is empty</p>
            <p class="text-xs mt-1">Select items with size, color, and pack to start.</p>
          </div>`;
        return;
      }

      let html = '<div class="flex-1 space-y-2 overflow-y-auto pr-1">';
      cart.forEach((item, idx) => {
        html += `
          <div class="flex items-center justify-between bg-gray-50 p-2 rounded-xl border border-gray-200">
            <div class="flex items-center gap-2">
              <img src="${item.image}" class="w-10 h-10 object-cover rounded-lg" />
              <div>
                <h4 class="text-[11px] font-bold text-gray-800 line-clamp-1">${item.name}</h4>
                <p class="text-[9px] text-gray-500">${item.size} | ${item.color} | ${item.pack} (x${item.qty})</p>
                <p class="text-xs text-orange-600 font-black">${formatPrice(item.totalPrice)}</p>
              </div>
            </div>
            <button onclick="removeFromCart(${idx})" class="text-red-600 text-xs font-bold px-2 py-1">Remove</button>
          </div>`;
      });
      html += '</div>';

      const btnLabel = isLoggedIn ? 'Proceed to Paystack Checkout' : 'Log In / Register to Checkout';

      body.innerHTML = `
        ${html}
        <div class="border-t pt-3 mt-3 bg-orange-50 p-3 rounded-xl space-y-1 text-xs">
          <div class="flex justify-between font-bold text-gray-700">
            <span>Total Goods Value:</span>
            <span>${formatPrice(totalKsh)}</span>
          </div>
          <div class="flex justify-between font-black text-green-700">
            <span>Pay 30% Deposit Now:</span>
            <span>${formatPrice(depositKsh)}</span>
          </div>
          <div class="flex justify-between font-black text-orange-800 border-t border-orange-200 pt-1">
            <span>Pay 70% Balance After Delivery:</span>
            <span>${formatPrice(balanceKsh)}</span>
          </div>
        </div>
        <button onclick="handleCheckoutClick()" class="w-full mt-3 bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl text-xs shadow">
          ${btnLabel}
        </button>
      `;
    }

    function closeCartDrawer() {
      document.getElementById('cartDrawer').classList.add('hidden');
    }

    function handleCheckoutClick() {
      if (!isLoggedIn) {
        closeCartDrawer();
        openAuthModal('login');
      } else {
        renderPaystackForm();
      }
    }

    function renderPaystackForm() {
      const title = document.getElementById('drawerTitle');
      const body = document.getElementById('drawerBody');
      title.innerText = 'Paystack 30% Deposit Checkout';

      const totalKsh = cart.reduce((sum, i) => sum + i.totalPrice, 0);
      const depositKsh = Math.round(totalKsh * 0.3);

      body.innerHTML = `
        <form onsubmit="processPaystackPayment(event)" class="flex-1 flex flex-col justify-between space-y-3">
          <div class="space-y-2 text-xs">
            <div>
              <label class="block font-bold text-gray-700 mb-0.5">Destination Country</label>
              <select id="payCountry" class="w-full p-2 border rounded bg-white">
                <option value="Kenya">Kenya</option>
                <option value="Uganda">Uganda</option>
                <option value="Tanzania">Tanzania</option>
                <option value="Rwanda">Rwanda</option>
                <option value="Burundi">Burundi</option>
                <option value="South Sudan">South Sudan</option>
              </select>
            </div>
            <div>
              <label class="block font-bold text-gray-700 mb-0.5">City & Delivery Address</label>
              <input type="text" id="payAddress" required placeholder="Nairobi CBD, Kampala Road..." class="w-full p-2 border rounded" />
            </div>
            <div class="bg-blue-50 border border-blue-200 p-2.5 rounded-xl text-[11px] text-blue-900">
              <p class="font-bold">🔒 Paystack Live Payment Gateway</p>
              <p class="mt-0.5">Pay 30% deposit (${formatPrice(depositKsh)}) via M-Pesa, Airtel Money, or Cards.</p>
            </div>
          </div>
          <div class="border-t pt-2 flex gap-2">
            <button type="button" onclick="openCartDrawer()" class="w-1/3 bg-gray-200 text-gray-800 font-bold py-2.5 rounded-xl text-xs">Back</button>
            <button type="submit" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs shadow">
              Pay ${formatPrice(depositKsh)} via Paystack
            </button>
          </div>
        </form>
      `;
    }

    function processPaystackPayment(e) {
      e.preventDefault();
      const country = document.getElementById('payCountry').value;
      const address = document.getElementById('payAddress').value;

      const totalKsh = cart.reduce((sum, i) => sum + i.totalPrice, 0);
      const depositKsh = Math.round(totalKsh * 0.3);
      const balanceKsh = totalKsh - depositKsh;

      const cfg = currencyRates[selectedCurrency] || currencyRates.KSh;
      const payCurr = ['KES', 'NGN', 'GHS', 'ZAR', 'USD'].includes(cfg.iso) ? cfg.iso : 'KES';
      const amountSubunits = Math.round((payCurr === 'KES' ? depositKsh : depositKsh * cfg.rate) * 100);
      const reference = 'KILI-' + Math.floor(100000000 + Math.random() * 900000000);

      const handler = window.PaystackPop.setup({
        key: PAYSTACK_PUBLIC_KEY,
        email: customer.email,
        amount: amountSubunits,
        currency: payCurr,
        ref: reference,
        callback: function(res) {
          orders.unshift({
            id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
            ref: res.reference,
            total: totalKsh,
            deposit: depositKsh,
            balance: balanceKsh,
            status: 'Dispatched',
            date: new Date().toISOString().split('T')[0],
            country: `${country} (${address})`
          });

          notifications.unshift({
            id: Date.now(),
            title: 'Order Confirmed & Dispatched!',
            msg: `Deposit received (Ref: ${res.reference}). Your order is on the way to ${country}.`,
            date: new Date().toISOString().split('T')[0]
          });

          cart = [];
          pickedProductIds = [];
          updateCartCounters();
          renderStoreContent();

          document.getElementById('drawerTitle').innerText = 'Deposit Verified!';
          document.getElementById('drawerBody').innerHTML = `
            <div class="flex-1 flex flex-col items-center justify-center text-center">
              <div class="w-14 h-14 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-2xl font-bold mb-3">✓</div>
              <h3 class="text-base font-black text-gray-800 mb-1">Paystack Deposit Successful!</h3>
              <p class="text-[11px] font-mono text-gray-500 mb-2">Ref: ${res.reference}</p>
              <p class="text-xs text-gray-600 mb-4">Your order has been logged in your account dashboard for tracking.</p>
              <button onclick="closeCartDrawer(); switchTab('account');" class="w-full bg-orange-600 text-white font-bold py-2.5 rounded-xl text-xs shadow">
                View Order & Tracking
              </button>
            </div>
          `;
        },
        onClose: function() {}
      });
      handler.openIframe();
    }

    // =========================================================================
    // CUSTOMER ACCOUNT & TRACKING DASHBOARD
    // =========================================================================
    function handleAccountClick() {
      if (!isLoggedIn) {
        openAuthModal('login');
      } else {
        switchTab('account');
      }
    }

    function openAuthModal(mode) {
      authMode = mode;
      document.getElementById('authModal').classList.remove('hidden');
      document.getElementById('authTitle').innerText = mode === 'login' ? 'Customer Login' : 'Create Account';
      document.getElementById('nameFieldBox').classList.toggle('hidden', mode === 'login');
      document.getElementById('authSubmitBtn').innerText = mode === 'login' ? 'Log In' : 'Register Account';
    }

    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');
    }

    function toggleAuthMode() {
      openAuthModal(authMode === 'login' ? 'register' : 'login');
    }

    function submitAuth(e) {
      e.preventDefault();
      const name = document.getElementById('authName').value.trim();
      const email = document.getElementById('authEmail').value.trim();
      const phone = document.getElementById('authPhone').value.trim();

      if (authMode === 'register' && name) customer.name = name;
      customer.email = email;
      customer.phone = phone;
      isLoggedIn = true;

      closeAuthModal();
      document.getElementById('bottomNavAccountLabel').innerText = 'Profile';

      notifications.unshift({
        id: Date.now(),
        title: 'Account Active',
        msg: `Welcome, ${customer.name}! You can now track and manage your orders.`,
        date: new Date().toISOString().split('T')[0]
      });

      if (cart.length > 0) {
        openCartDrawer();
        renderPaystackForm();
      } else {
        switchTab('account');
      }
    }

    function logoutCustomer() {
      isLoggedIn = false;
      document.getElementById('bottomNavAccountLabel').innerText = 'Account';
      switchTab('home');
    }

    function renderAccountView() {
      document.getElementById('accNameEmail').innerText = `${customer.name} (${customer.email})`;
      document.getElementById('accPhone').innerText = `Phone: ${customer.phone}`;

      const notifBox = document.getElementById('accNotifications');
      notifBox.innerHTML = notifications.map(n => `
        <div class="bg-blue-50 border border-blue-100 p-2.5 rounded-xl text-[11px] flex justify-between items-center">
          <div>
            <p class="font-bold text-blue-900">${n.title}</p>
            <p class="text-blue-700">${n.msg}</p>
          </div>
          <span class="text-[9px] text-blue-500 whitespace-nowrap ml-2">${n.date}</span>
        </div>
      `).join('');

      const ordBox = document.getElementById('accOrders');
      ordBox.innerHTML = orders.map(o => {
        const isCancelled = o.status === 'Cancelled';
        const statusBadge = isCancelled 
          ? `<span class="bg-red-100 text-red-800 text-[9px] font-bold px-2 py-0.5 rounded-full">Cancelled</span>`
          : `<span class="bg-green-100 text-green-800 text-[9px] font-bold px-2 py-0.5 rounded-full">${o.status}</span>`;

        const cancelBtn = (!isCancelled && o.status !== 'Delivered')
          ? `<div class="flex justify-end pt-2 border-t"><button onclick="cancelOrder('${o.id}')" class="bg-red-50 text-red-600 border border-red-200 px-2.5 py-1 rounded text-[11px] font-bold">Cancel Order</button></div>`
          : '';

        return `
          <div class="border border-gray-200 rounded-xl p-3 bg-white shadow-sm space-y-1.5 text-xs">
            <div class="flex justify-between items-center border-b pb-1.5">
              <span class="font-black text-gray-900">${o.id} (${o.date})</span>
              ${statusBadge}
            </div>
            <p><strong>Destination:</strong> ${o.country}</p>
            <p><strong>30% Deposit Paid:</strong> KSh ${o.deposit.toLocaleString()} (Ref: ${o.ref})</p>
            <p><strong>70% Balance Due on Delivery:</strong> KSh ${o.balance.toLocaleString()}</p>
            ${cancelBtn}
          </div>
        `;
      }).join('');
    }

    function cancelOrder(id) {
      orders = orders.map(o => o.id === id ? { ...o, status: 'Cancelled' } : o);
      notifications.unshift({
        id: Date.now(),
        title: 'Order Cancelled',
        msg: `Order ${id} was cancelled successfully.`,
        date: new Date().toISOString().split('T')[0]
      });
      renderAccountView();
    }

    // INITIALIZE APP ON LOAD
    renderStoreContent();
    updateCartCounters();
  </script>
</body>
</html>
