<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kilimall - Online Shopping Kenya | Mega Deals & M-Pesa Checkout</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Top Announcement Bar -->
    <div class="bg-red-700 text-white text-xs py-1.5 px-4 text-center font-medium">
        🔥 Flash Sale: Up to 60% OFF on Smartphones & Electronics! Free delivery on orders over KSh 2,500.
    </div>

    <!-- Main Navigation Header -->
    <header class="sticky top-0 z-40 bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2 cursor-pointer" onclick="resetFilters()">
                <div class="bg-red-600 text-white font-bold px-3 py-1.5 rounded-lg tracking-wider flex items-center gap-1 shadow-md">
                    <i class="fa-solid fa-bag-shopping"></i> Kili mall
                </div>
            </div>
            <div class="flex-1 max-w-xl relative">
                <input type="text" placeholder="Search products..." class="w-full bg-gray-100 rounded-full py-2 pl-4 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                <button class="absolute right-3 top-2.5 text-red-600"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Content Catalog -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-fire text-red-600"></i> All Products Catalog
            </h2>
            <span id="item-counter" class="text-sm text-gray-500 font-medium">Showing items...</span>
        </div>

        <!-- Product Grid Container -->
        <div id="product-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Dynamic products load here automatically -->
        </div>

        <!-- Pagination Controls -->
        <div class="flex justify-center items-center gap-4 mt-8 mb-4">
            <button onclick="changePage(-1)" class="bg-white border border-gray-300 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-100 shadow-sm">Previous</button>
            <span id="page-indicator" class="text-sm font-medium text-gray-600">Page 1</span>
            <button onclick="changePage(1)" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-700 shadow-sm">Next</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 text-center py-4 text-xs text-gray-500">
        &copy; 2026 Kili mall Kenya. All rights reserved.
    </footer>

    <!-- JavaScript Logic for 3,000 Products & Pagination -->
    <script>
        const categories = ['Smartphones', 'Electronics', 'Home Appliances', 'Fashion', 'Accessories'];
        const brands = ['Samsung', 'Apple', 'Xiaomi', 'Sony', 'LG', 'Huawei', 'OnePlus', 'Anker', 'JBL', 'Oppo', 'Tecno', 'Infinix'];
        const allProducts = [];

        // Generate 3,000 unique products programmatically
        for (let i = 1; i <= 3000; i++) {
            const category = categories[Math.floor(Math.random() * categories.length)];
            const brand = brands[Math.floor(Math.random() * brands.length)];
            
            allProducts.push({
                id: i,
                name: `${brand} Pro Item #${i}`,
                category: category,
                price: Math.floor(Math.random() * 45000) + 1000,
                discount: Math.floor(Math.random() * 50) + 10,
                image: `https://picsum.photos/seed/kili_product_${i}/300/300`
            });
        }

        let currentPage = 1;
        const itemsPerPage = 20;

        function renderCatalog(page = 1) {
            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentItems = allProducts.slice(startIndex, endIndex);

            const container = document.getElementById('product-container');
            if (!container) return;
            
            container.innerHTML = '';

            currentItems.forEach(product => {
                container.innerHTML += `
                    <div class="product-card bg-white p-3 rounded-lg shadow-sm border border-gray-100 flex flex-col justify-between">
                        <div>
                            <span class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded font-bold">-${product.discount}%</span>
                            <img src="${product.image}" alt="${product.name}" class="w-full h-36 object-cover my-2 rounded" />
                            <h3 class="font-semibold text-xs text-gray-800 truncate">${product.name}</h3>
                            <p class="text-xs text-gray-400 mt-0.5">${product.category}</p>
                        </div>
                        <div class="mt-2">
                            <p class="text-red-600 font-bold text-sm">KSh ${product.price.toLocaleString()}</p>
                        </div>
                    </div>
                `;
            });

            // Update counter text
            const counter = document.getElementById('item-counter');
            if (counter) {
                counter.innerText = `Showing ${startIndex + 1}–${Math.min(endIndex, allProducts.length)} of ${allProducts.length} items`;
            }

            // Update page indicator
            const pageIndicator = document.getElementById('page-indicator');
            if (pageIndicator) {
                pageIndicator.innerText = `Page ${page} of ${Math.ceil(allProducts.length / itemsPerPage)}`;
            }
        }

        function changePage(direction) {
            const totalPages = Math.ceil(allProducts.length / itemsPerPage);
            currentPage += direction;
            
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            
            renderCatalog(currentPage);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFilters() {
            currentPage = 1;
            renderCatalog(currentPage);
        }

        // Initial render on page load
        renderCatalog(currentPage);
    </script>
</body>
</html>
