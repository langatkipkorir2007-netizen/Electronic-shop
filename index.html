<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kili-Mall East Africa | Official Store & App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans pb-24">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const PAYSTACK_PK = 'pk_live_96685dc1a36bc585d08a7b5fd4a4891d8bce14cb';

    const KiliMallApp = () => {
      const [viewMode, setViewMode] = useState('store'); // 'store' | 'account'
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      
      // Track picked items to remove yellow highlights
      const [pickedProductIds, setPickedProductIds] = useState([]);
      
      // Auth & Account States
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState({ name: 'John Doe', email: 'john@example.com', phone: '+254712345678' });
      const [authMode, setAuthMode] = useState('login');

      // Checkout States
      const [checkoutStep, setCheckoutStep] = useState('cart');
      const [selectedCurrency, setSelectedCurrency] = useState('KSh');
      const [destinationCountry, setDestinationCountry] = useState('Kenya');
      const [shippingAddress, setShippingAddress] = useState('');
      const [lastPaymentRef, setLastPaymentRef] = useState('');

      // Notifications Inbox
      const [notifications, setNotifications] = useState([
        { id: 1, title: 'Welcome to Kili-Mall!', msg: 'Enjoy 30% deposit checkout and 70% balance on delivery across East Africa.', date: '2026-11-17', read: false }
      ]);

      // Customer Orders State
      const [orders, setOrders] = useState([
        { id: 'ORD-5421', ref: 'PSK-99214', items: [{ name: 'Samsung Galaxy A15', qty: 1, price: 18500 }], total: 18500, deposit: 5550, balance: 12950, status: 'Dispatched', date: '2026-11-16', country: 'Kenya' }
      ]);

      const categories = [
        'Supermarket & Groceries',
        'Phones & Tablets',
        'Computing & Laptops',
        'Electronics & Audio',
        'Home & Office Appliances',
        'Fashion & Apparel',
        'Health & Beauty',
        'Baby Products',
        'Gaming & Toys',
        'Sporting Goods'
      ];

      const currencyRates = {
        KSh: { symbol: 'KSh ', iso: 'KES', rate: 1, label: 'KES (Kenya Shilling)' },
        USD: { symbol: '$', iso: 'USD', rate: 0.0077, label: 'USD (US Dollar)' },
        UGX: { symbol: 'USh ', iso: 'UGX', rate: 29.5, label: 'UGX (Uganda Shilling)' },
        TZS: { symbol: 'TSh ', iso: 'TZS', rate: 20.2, label: 'TZS (Tanzania Shilling)' },
        RWF: { symbol: 'FRw ', iso: 'RWF', rate: 10.5, label: 'RWF (Rwandan Franc)' }
      };

      const masterCatalog = useMemo(() => [
        { id: 101, name: 'Jogoo Maize Meal Flour 2kg', category: 'Supermarket & Groceries', price: 130, originalPrice: 190, discount: '32% OFF', image: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?w=600&q=80', sizes: ['2kg Pack', '5kg Bale'], colors: ['Standard White'] },
        { id: 102, name: 'Brookside Fresh Whole Milk 1L', category: 'Supermarket & Groceries', price: 145, originalPrice: 180, discount: '19% OFF', image: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?w=600&q=80', sizes: ['1 Litre', '500ml'], colors: ['Fresh White'] },
        { id: 201, name: 'Samsung Galaxy A15 6.5" 128GB/4GB', category: 'Phones & Tablets', price: 18500, originalPrice: 24000, discount: '23% OFF', image: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600&q=80', sizes: ['128GB/4GB', '256GB/8GB'], colors: ['Blue Black', 'Light Blue', 'Yellow'] },
        { id: 202, name: 'Redmi Note 13 Pro 256GB/8GB', category: 'Phones & Tablets', price: 28000, originalPrice: 35000, discount: '20% OFF', image: 'https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=600&q=80', sizes: ['256GB/8GB'], colors: ['Midnight Black', 'Forest Green', 'Lavender Purple'] },
        { id: 301, name: 'HP Pavilion 15 Core i5 16GB/512GB SSD', category: 'Computing & Laptops', price: 69000, originalPrice: 85000, discount: '19% OFF', image: 'https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=600&q=80', sizes: ['16GB RAM / 512GB SSD'], colors: ['Natural Silver', 'Nightfall Black'] },
        { id: 401, name: 'Hisense 43" Smart Frameless LED TV', category: 'Electronics & Audio', price: 29900, originalPrice: 38000, discount: '21% OFF', image: 'https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=600&q=80', sizes: ['43 Inch', '50 Inch'], colors: ['Frameless Black'] },
        { id: 402, name: 'Sony WH-1000XM5 ANC Headphones', category: 'Electronics & Audio', price: 36000, originalPrice: 46000, discount: '22% OFF', image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&q=80', sizes: ['Over-Ear Standard'], colors: ['Black', 'Silver', 'Midnight Blue'] },
        { id: 501, name: 'Ramtons 20L Digital Microwave Oven', category: 'Home & Office Appliances', price: 10900, originalPrice: 14000, discount: '22% OFF', image: 'https://images.unsplash.com/photo-1574269909862-7e1d70bb8078?w=600&q=80', sizes: ['20 Litre'], colors: ['Silver Metallic'] },
        { id: 601, name: 'Men Breathable Sports Running Sneakers', category: 'Fashion & Apparel', price: 2200, originalPrice: 3500, discount: '37% OFF', image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&q=80', sizes: ['EU 40', 'EU 41', 'EU 42', 'EU 43', 'EU 44'], colors: ['Fire Red', 'Jet Black', 'Pure White'] },
        { id: 701, name: 'Hydrating Vitamin C Face Serum 50ml', category: 'Health & Beauty', price: 3500, originalPrice: 4800, discount: '27% OFF', image: 'https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=600&q=80', sizes: ['50ml Bottle'], colors: ['Clear'] },
        { id: 801, name: 'Soft Baby Diapers Jumbo Pack (64s)', category: 'Baby Products', price: 2100, originalPrice: 2800, discount: '25% OFF', image: 'https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=600&q=80', sizes: ['Size 3 (64s)', 'Size 4 (56s)', 'Size 5 (48s)'], colors: ['White Jumbo'] },
        { id: 901, name: 'PS5 DualSense Wireless Controller', category: 'Gaming & Toys', price: 8200, originalPrice: 11000, discount: '25% OFF', image: 'https://images.unsplash.com/photo-1606318801954-d46d46d3360a?w=600&q=80', sizes: ['Standard Edition'], colors: ['White', 'Cosmic Red', 'Midnight Black'] },
        { id: 1001, name: 'FIFA Match Training Football Size 5', category: 'Sporting Goods', price: 1700, originalPrice: 2500, discount: '32% OFF', image: 'https://images.unsplash.com/photo-1614632537456-c30d719003f5?w=600&q=80', sizes: ['Size 5 Official'], colors: ['White/Blue', 'Yellow/Black'] }
      ], []);

      const [selectedOptions, setSelectedOptions] = useState({});

      const handleOptionChange = (productId, optionType, value) => {
        setSelectedOptions(prev => ({
          ...prev,
          [productId]: { ...(prev[productId] || {}), [optionType]: value }
        }));
      };

      const formatPrice = (amountInKsh) => {
        const config = currencyRates[selectedCurrency] || currencyRates.KSh;
        const converted = amountInKsh * config.rate;
        if (selectedCurrency === 'USD') return `${config.symbol}${converted.toFixed(2)}`;
        return `${config.symbol}${Math.round(converted).toLocaleString()}`;
      };

      const filteredProducts = useMemo(() => {
        return masterCatalog.filter((product) => {
          const matchesCategory = selectedCategory === 'All' || product.category === selectedCategory;
          const matchesSearch = product.name.toLowerCase().includes(searchQuery.toLowerCase()) || product.category.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });
      }, [masterCatalog, selectedCategory, searchQuery]);

      const addToCartWithOptions = (product) => {
        const opts = selectedOptions[product.id] || {};
        const chosenSize = opts.size || product.sizes[0];
        const chosenColor = opts.color || product.colors[0];
        const chosenQty = opts.qty || 1;

        const cartItem = {
          ...product,
          cartId: `${product.id}-${chosenSize}-${chosenColor}`,
          selectedSize: chosenSize,
          selectedColor: chosenColor,
          quantity: Number(chosenQty),
          price: product.price * Number(chosenQty)
        };

        setCart(prev => [...prev, cartItem]);
        setPickedProductIds(prev => [...prev, product.id]);
        setIsCartOpen(true);
      };

      const removeFromCart = (index) => setCart((prev) => prev.filter((_, i) => i !== index));

      const cartTotalKsh = cart.reduce((sum, item) => sum + item.price, 0);
      const depositAmountKsh = Math.round(cartTotalKsh * 0.3);
      const balanceOnDeliveryKsh = cartTotalKsh - depositAmountKsh;

      const cancelOrder = (orderId) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: 'Cancelled' } : o));
        setNotifications(prev => [{ id: Date.now(), title: 'Order Cancelled', msg: `Order ${orderId} was successfully cancelled.`, date: new Date().toISOString().split('T')[0], read: false }, ...prev]);
      };

      const handlePaystackCheckout = (e) => {
        e.preventDefault();
        if (!isLoggedIn) {
          setIsCartOpen(false);
          setIsAuthOpen(true);
          return;
        }

        const currencyConfig = currencyRates[selectedCurrency] || currencyRates.KSh;
        const payCurrency = ['KES', 'NGN', 'GHS', 'ZAR', 'USD'].includes(currencyConfig.iso) ? currencyConfig.iso : 'KES';
        const amountInSubunits = Math.round((payCurrency === 'KES' ? depositAmountKsh : depositAmountKsh * currencyConfig.rate) * 100);
        const reference = 'KILI-' + Math.floor(100000000 + Math.random() * 900000000);

        const handler = window.PaystackPop.setup({
          key: PAYSTACK_PK,
          email: currentUser.email,
          amount: amountInSubunits,
          currency: payCurrency,
          ref: reference,
          callback: function (response) {
            const newOrder = {
              id: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
              ref: response.reference,
              items: [...cart],
              total: cartTotalKsh,
              deposit: depositAmountKsh,
              balance: balanceOnDeliveryKsh,
              status: 'Dispatched',
              date: new Date().toISOString().split('T')[0],
              country: destinationCountry
            };
            setOrders(prev => [newOrder, ...prev]);
            setNotifications(prev => [{ id: Date.now(), title: 'Order Placed!', msg: `Your 30% deposit for order ${newOrder.id} was received via Paystack.`, date: new Date().toISOString().split('T')[0], read: false }, ...prev]);
            setLastPaymentRef(response.reference);
            setCheckoutStep('success');
            setCart([]);
          },
          onClose: function () {}
        });
        handler.openIframe();
      };

      const categoriesToRender = selectedCategory === 'All' ? categories : [selectedCategory];

      return (
        <div className="bg-gray-100 min-h-screen font-sans text-gray-900 pb-24">
          
          {/* Top Sticky Header */}
          <header className="bg-orange-600 text-white sticky top-0 z-50 shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
              <div className="flex items-center justify-between w-full md:w-auto">
                <h1 className="text-xl md:text-2xl font-black tracking-wider cursor-pointer" onClick={() => { setSelectedCategory('All'); setSearchQuery(''); setViewMode('store'); }}>
                  KILI-MALL EAST AFRICA
                </h1>

                <div className="flex items-center gap-2 md:hidden">
                  <button onClick={() => isLoggedIn ? setViewMode('account') : setIsAuthOpen(true)} className="bg-orange-800 px-2.5 py-1.5 rounded text-xs font-bold">
                    {isLoggedIn ? '👤 Account' : '🔑 Login'}
                  </button>
                  <button onClick={() => setIsCartOpen(true)} className="bg-white text-orange-600 px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1 shadow-sm">
                    🛒 <span>{cart.length}</span>
                  </button>
                </div>
              </div>

              {viewMode === 'store' && (
                <div className="w-full md:w-1/2 flex items-center bg-white rounded-lg overflow-hidden shadow-sm">
                  <input
                    type="text"
                    placeholder="Search heavy discounts across East Africa..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full px-4 py-2 text-gray-800 text-sm focus:outline-none"
                  />
                  <button className="bg-orange-500 px-5 py-2 text-white font-bold text-sm hover:bg-orange-700 transition">
                    Search
                  </button>
                </div>
              )}

              <div className="hidden md:flex items-center gap-3">
                <select
                  value={selectedCurrency}
                  onChange={(e) => setSelectedCurrency(e.target.value)}
                  className="bg-orange-700 text-white text-xs font-bold px-3 py-2.5 rounded-lg border border-orange-500 focus:outline-none"
                >
                  {Object.entries(currencyRates).map(([code, info]) => (
                    <option key={code} value={code}>{info.label}</option>
                  ))}
                </select>

                <button onClick={() => isLoggedIn ? setViewMode('account') : setIsAuthOpen(true)} className="bg-orange-800 hover:bg-orange-900 transition px-4 py-2 rounded-lg font-bold text-sm shadow-sm flex items-center gap-1.5">
                  <span>👤</span> {isLoggedIn ? currentUser.name.split(' ')[0] : 'Account / Login'}
                </button>

                <button onClick={() => setIsCartOpen(true)} className="bg-white text-orange-600 hover:bg-orange-50 transition px-4 py-2 rounded-lg font-bold text-sm shadow-sm flex items-center gap-2">
                  <span>🛒 Cart</span>
                  <span className="bg-orange-600 text-white px-2 py-0.5 rounded-full text-xs">{cart.length}</span>
                </button>
              </div>
            </div>

            {/* Category Navigation Bar */}
            {viewMode === 'store' && (
              <nav className="bg-orange-700 text-white text-xs overflow-x-auto no-scrollbar">
                <div className="max-w-7xl mx-auto px-4 py-2 flex items-center gap-2 whitespace-nowrap">
                  <button onClick={() => setSelectedCategory('All')} className={`px-3 py-1 rounded-full font-bold transition ${selectedCategory === 'All' ? 'bg-white text-orange-700' : 'hover:bg-orange-600'}`}>
                    All 10 Departments
                  </button>
                  {categories.map((cat) => (
                    <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-3 py-1 rounded-full font-semibold transition ${selectedCategory === cat ? 'bg-white text-orange-700' : 'hover:bg-orange-600'}`}>
                      {cat}
                    </button>
                  ))}
                </div>
              </nav>
            )}
          </header>

          {/* Banner */}
          <div className="bg-gray-900 text-white text-center py-2 text-xs font-semibold px-4 flex flex-wrap items-center justify-center gap-3">
            <span>🌍 East Africa Delivery (Kenya, Uganda, Tanzania, Rwanda, Burundi, South Sudan)</span>
            <span>•</span>
            <span className="text-orange-400 font-bold">Pay 30% Deposit Now</span>
            <span>•</span>
            <span className="text-green-400 font-bold">70% Balance After Delivery</span>
          </div>

          {/* APP VIEW SWITCHER */}
          {viewMode === 'account' ? (
            <main className="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
              <div className="bg-white rounded-2xl shadow-sm p-6 border border-gray-200">
                <div className="flex justify-between items-center border-b pb-4 mb-6">
                  <div>
                    <h2 className="text-xl font-black text-gray-800">Customer Account & Order Dashboard</h2>
                    <p className="text-xs text-gray-500">Track orders, check past purchases, and read notification alerts.</p>
                  </div>
                  <button onClick={() => setViewMode('store')} className="bg-orange-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-orange-700">
                    Return to Store
                  </button>
                </div>

                <div className="bg-orange-50 border border-orange-200 p-4 rounded-xl flex items-center justify-between mb-6">
                  <div>
                    <p className="text-xs text-orange-800 font-bold uppercase">Logged in Customer</p>
                    <p className="text-base font-black text-gray-900">{currentUser.name} ({currentUser.email})</p>
                    <p className="text-xs text-gray-600">{currentUser.phone}</p>
                  </div>
                  <button onClick={() => { setIsLoggedIn(false); setViewMode('store'); }} className="bg-white text-red-600 border border-red-200 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-50">
                    Log Out
                  </button>
                </div>

                <div className="mb-6">
                  <h3 className="text-sm font-bold text-gray-800 mb-2 uppercase tracking-wide">🔔 Notifications Inbox</h3>
                  <div className="space-y-2">
                    {notifications.map(n => (
                      <div key={n.id} className="bg-blue-50 border border-blue-100 p-3 rounded-xl text-xs flex justify-between items-center">
                        <div>
                          <p className="font-bold text-blue-900">{n.title}</p>
                          <p className="text-blue-700 mt-0.5">{n.msg}</p>
                        </div>
                        <span className="text-[10px] text-blue-500">{n.date}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div>
                  <h3 className="text-sm font-bold text-gray-800 mb-2 uppercase tracking-wide">📦 My Orders & Tracking</h3>
                  <div className="space-y-4">
                    {orders.map(order => (
                      <div key={order.id} className="border border-gray-200 rounded-xl p-4 bg-white shadow-sm space-y-3">
                        <div className="flex justify-between items-center border-b pb-2">
                          <div>
                            <span className="font-black text-gray-900">{order.id}</span>
                            <span className="text-xs text-gray-500 ml-2">({order.date})</span>
                          </div>
                          <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${order.status === 'Cancelled' ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}`}>
                            {order.status}
                          </span>
                        </div>
                        
                        <div className="text-xs space-y-1 text-gray-600">
                          <p><strong>Destination:</strong> {order.country}</p>
                          <p><strong>Total Value:</strong> {formatPrice(order.total)}</p>
                          <p><strong>30% Deposit Paid (Paystack):</strong> {formatPrice(order.deposit)} (Ref: {order.ref})</p>
                          <p className="text-orange-600 font-bold"><strong>70% Balance Due on Delivery:</strong> {formatPrice(order.balance)}</p>
                        </div>

                        {order.status !== 'Cancelled' && (
                          <div className="flex justify-end pt-2">
                            <button onClick={() => cancelOrder(order.id)} className="text-xs text-red-600 font-bold hover:underline">
                              Cancel Order
                            </button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </main>
          ) : (
            <main className="max-w-7xl mx-auto px-4 py-6 space-y-10">
              {categoriesToRender.map((cat) => {
                const departmentProducts = filteredProducts.filter(p => p.category === cat);
                if (departmentProducts.length === 0) return null;

                return (
                  <section key={cat} className="space-y-4">
                    <div className="flex justify-between items-center border-b-2 border-orange-500 pb-2">
                      <h2 className="text-lg md:text-xl font-black uppercase tracking-wide text-gray-800">{cat}</h2>
                      <span className="text-xs font-bold text-orange-600 bg-orange-100 px-3 py-1 rounded-full">
                        {departmentProducts.length} Items Available
                      </span>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                      {departmentProducts.map((product) => {
                        const opts = selectedOptions[product.id] || {};
                        const currentSize = opts.size || product.sizes[0];
                        const currentColor = opts.color || product.colors[0];
                        const currentQty = opts.qty || 1;

                        return (
                          <div key={product.id} className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between transition hover:shadow-md">
                            <div>
                              <div className="relative bg-gray-50 p-2">
                                <span className="absolute top-2 left-2 bg-red-600 text-white font-black text-[10px] px-2 py-0.5 rounded-md shadow-sm">
                                  {product.discount}
                                </span>
                                <img src={product.image} alt={product.name} className="w-full h-36 object-contain mix-blend-multiply" />
                              </div>

                              <div className="p-3 space-y-2">
                                <h3 className="text-xs font-bold text-gray-800 line-clamp-2 h-8">{product.name}</h3>
                                
                                <div>
                                  <p className="text-sm font-black text-orange-600">{formatPrice(product.price * currentQty)}</p>
                                  <p className="text-[10px] text-gray-400 line-through">{formatPrice(product.originalPrice)}</p>
                                </div>

                                <div className="space-y-1.5 pt-1 text-[11px]">
                                  <div>
                                    <label className="text-gray-500 text-[10px] block font-semibold">Size / Option:</label>
                                    <select
                                      value={currentSize}
                                      onChange={(e) => handleOptionChange(product.id, 'size', e.target.value)}
                                      className="w-full border border-gray-300 rounded p-1 text-xs bg-gray-50 focus:outline-none"
                                    >
                                      {product.sizes.map(s => <option key={s} value={s}>{s}</option>)}
                                    </select>
                                  </div>

                                  <div>
                                    <label className="text-gray-500 text-[10px] block font-semibold">Color / Variant:</label>
                                    <select
                                      value={currentColor}
                                      onChange={(e) => handleOptionChange(product.id, 'color', e.target.value)}
                                      className="w-full border border-gray-300 rounded p-1 text-xs bg-gray-50 focus:outline-none"
                                    >
                                      {product.colors.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                  </div>
                                </div>
                              </div>
                            </div>

                            <div className="p-3 pt-0">
                              <button
                                onClick={() => addToCartWithOptions(product)}
                                className="w-full bg-orange-600 hover:bg-orange-700 text-white py-2 rounded-xl text-xs font-bold transition shadow-sm"
                              >
                                Add to Cart
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </section>
                );
              })}
            </main>
          )}

          {/* CART & CHECKOUT DRAWER */}
          {isCartOpen && (
            <div className="fixed inset-0 bg-black/60 z-50 flex justify-end backdrop-blur-xs">
              <div className="bg-white w-full max-w-lg h-full flex flex-col shadow-2xl animate-in slide-in-from-right duration-200">
                <div className="p-4 bg-orange-600 text-white flex justify-between items-center">
                  <h2 className="font-black text-base">🛒 Shopping Cart ({cart.length})</h2>
                  <button onClick={() => setIsCartOpen(false)} className="text-white text-lg font-bold">✕</button>
                </div>

                {checkoutStep === 'cart' ? (
                  <div className="flex-1 overflow-y-auto p-4 space-y-4">
                    {cart.length === 0 ? (
                      <div className="text-center py-20 text-gray-400 space-y-2">
                        <p className="text-4xl">🛒</p>
                        <p className="text-sm font-bold">Your cart is empty</p>
                        <p className="text-xs">Add items from the store to begin your order.</p>
                      </div>
                    ) : (
                      <>
                        <div className="space-y-3">
                          {cart.map((item, idx) => (
                            <div key={item.cartId || idx} className="flex gap-3 bg-gray-50 border border-gray-200 p-3 rounded-xl items-center">
                              <img src={item.image} alt={item.name} className="w-16 h-16 object-contain bg-white rounded-lg border p-1" />
                              <div className="flex-1 text-xs">
                                <h4 className="font-bold text-gray-800">{item.name}</h4>
                                <p className="text-gray-500">Size: {item.selectedSize} | Color: {item.selectedColor}</p>
                                <p className="text-orange-600 font-bold mt-1">{formatPrice(item.price)}</p>
                              </div>
                              <button onClick={() => removeFromCart(idx)} className="text-red-500 font-bold text-xs p-2 hover:bg-red-50 rounded-lg">
                                🗑️
                              </button>
                            </div>
                          ))}
                        </div>

                        {/* Destination & Country Selector */}
                        <div className="bg-orange-50 border border-orange-200 p-4 rounded-2xl space-y-3">
                          <h3 className="text-xs font-black text-orange-900 uppercase">📍 East Africa Delivery Destination</h3>
                          <div className="grid grid-cols-2 gap-2 text-xs">
                            {['Kenya', 'Uganda', 'Tanzania', 'Rwanda', 'Burundi', 'South Sudan'].map(country => (
                              <label key={country} className={`flex items-center gap-2 p-2 rounded-xl border cursor-pointer font-semibold ${destinationCountry === country ? 'bg-orange-600 text-white border-orange-600' : 'bg-white text-gray-800 border-gray-200'}`}>
                                <input type="radio" name="country" checked={destinationCountry === country} onChange={() => setDestinationCountry(country)} className="hidden" />
                                <span>{country}</span>
                              </label>
                            ))}
                          </div>
                          <div>
                            <label className="text-[11px] font-bold text-gray-700 block mb-1">Detailed Delivery Address / Town / Street:</label>
                            <input
                              type="text"
                              placeholder="e.g. Westlands, Nairobi or CBD Kampala"
                              value={shippingAddress}
                              onChange={(e) => setShippingAddress(e.target.value)}
                              className="w-full p-2 text-xs border rounded-lg bg-white focus:outline-none"
                            />
                          </div>
                        </div>

                        {/* Financial Breakdown (30% / 70% rule) */}
                        <div className="bg-gray-900 text-white p-4 rounded-2xl space-y-2 text-xs">
                          <div className="flex justify-between text-gray-300">
                            <span>Total Order Value:</span>
                            <span className="font-bold text-white">{formatPrice(cartTotalKsh)}</span>
                          </div>
                          <div className="flex justify-between text-orange-400 font-bold text-sm border-t border-gray-800 pt-2">
                            <span>Pay 30% Deposit Now (Paystack):</span>
                            <span>{formatPrice(depositAmountKsh)}</span>
                          </div>
                          <div className="flex justify-between text-green-400 font-bold text-sm">
                            <span>70% Balance on Delivery:</span>
                            <span>{formatPrice(balanceOnDeliveryKsh)}</span>
                          </div>
                        </div>

                        <button
                          onClick={handlePaystackCheckout}
                          className="w-full bg-green-600 hover:bg-green-700 text-white py-3.5 rounded-xl font-black text-sm uppercase tracking-wider shadow-lg transition"
                        >
                          Pay 30% Deposit via Paystack ({formatPrice(depositAmountKsh)})
                        </button>
                      </>
                    )}
                  </div>
                ) : (
                  <div className="flex-1 p-6 flex flex-col items-center justify-center text-center space-y-4">
                    <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-3xl font-bold">✓</div>
                    <h3 className="text-xl font-black text-gray-900">30% Deposit Successful!</h3>
                    <p className="text-xs font-mono text-gray-500">Paystack Ref: {lastPaymentRef}</p>
                    <p className="text-xs text-gray-600 max-w-xs">
                      Thank you, <span className="font-bold">{currentUser.name}</span>. Your order is registered for delivery to <span className="font-bold text-orange-600">{destinationCountry}</span>. The remaining 70% balance will be paid upon delivery.
                    </p>
                    <button
                      onClick={() => { setIsCartOpen(false); setCheckoutStep('cart'); setViewMode('account'); }}
                      className="w-full bg-orange-600 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wide shadow"
                    >
                      View Order & Tracking Status
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* AUTHENTICATION MODAL */}
          {isAuthOpen && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 animate-in zoom-in-95 duration-150">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-black text-base text-gray-900">{authMode === 'login' ? '🔑 Customer Login' : '✨ Create Customer Account'}</h3>
                  <button onClick={() => setIsAuthOpen(false)} className="text-gray-400 font-bold text-lg">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  {authMode === 'register' && (
                    <div>
                      <label className="font-bold text-gray-700 block mb-1">Full Name:</label>
                      <input type="text" placeholder="John Doe" value={currentUser.name} onChange={(e) => setCurrentUser({...currentUser, name: e.target.value})} className="w-full p-2.5 border rounded-lg bg-gray-50 focus:outline-none" />
                    </div>
                  )}
                  <div>
                    <label className="font-bold text-gray-700 block mb-1">Email Address:</label>
                    <input type="email" placeholder="john@example.com" value={currentUser.email} onChange={(e) => setCurrentUser({...currentUser, email: e.target.value})} className="w-full p-2.5 border rounded-lg bg-gray-50 focus:outline-none" />
                  </div>
                  <div>
                    <label className="font-bold text-gray-700 block mb-1">Phone Number (M-Pesa / Mobile Money):</label>
                    <input type="text" placeholder="+254712345678" value={currentUser.phone} onChange={(e) => setCurrentUser({...currentUser, phone: e.target.value})} className="w-full p-2.5 border rounded-lg bg-gray-50 focus:outline-none" />
                  </div>

                  <button
                    onClick={() => { setIsLoggedIn(true); setIsAuthOpen(false); }}
                    className="w-full bg-orange-600 hover:bg-orange-700 text-white font-black py-3 rounded-xl uppercase tracking-wider shadow transition mt-2"
                  >
                    {authMode === 'login' ? 'Log In to Account' : 'Register & Continue'}
                  </button>

                  <div className="text-center pt-2">
                    {authMode === 'login' ? (
                      <p className="text-gray-500">Don't have an account? <button onClick={() => setAuthMode('register')} className="text-orange-600 font-bold underline">Register here</button></p>
                    ) : (
                      <p className="text-gray-500">Already have an account? <button onClick={() => setAuthMode('login')} className="text-orange-600 font-bold underline">Log in</button></p>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<KiliMallApp />);
  </script>
</body>
</html>
