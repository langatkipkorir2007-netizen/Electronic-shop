<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kili-Mall East Africa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans pb-28">

  <!-- TOP HEADER -->
  <header class="bg-black text-white sticky top-0 z-40 p-3 flex items-center justify-between">
    <h1 class="text-sm font-black tracking-wider text-orange-500">KILI-MALL EAST AFRICA</h1>
    <select id="currencySelector" onchange="changeCurrency(this.value)" class="bg-gray-900 text-orange-400 text-xs font-bold px-2 py-1 rounded border border-gray-700">
      <option value="KSh">KES</option>
      <option value="USD">USD</option>
      <option value="UGX">UGX</option>
      <option value="TZS">TZS</option>
    </select>
  </header>

  <!-- PRODUCT GRID CONTAINER -->
  <div id="productGrid" class="p-3 grid grid-cols-2 gap-2"></div>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50 flex justify-around items-center py-2 shadow-lg">
    <button onclick="switchTab('home')" class="flex flex-col items-center text-orange-600">
      <span class="text-lg">🏠</span>
      <span class="text-[10px] font-bold">Home</span>
    </button>
    <button onclick="openCart()" class="flex flex-col items-center text-gray-500 relative">
      <span class="text-lg">🛒</span>
      <span class="text-[10px] font-medium">Cart</span>
      <span id="cartCount" class="absolute -top-1 right-2 bg-orange-600 text-white text-[9px] font-black px-1.5 rounded-full">0</span>
    </button>
  </nav>

  <!-- CART DRAWER -->
  <div id="cartDrawer" class="hidden fixed inset-0 z-50 flex justify-end bg-black bg-opacity-50">
    <div class="w-full max-w-sm bg-white h-full p-4 flex flex-col">
      <div class="flex justify-between items-center border-b pb-2 mb-3">
        <h2 class="font-black text-sm">Shopping Cart</h2>
        <button onclick="closeCart()" class="font-bold text-lg">✕</button>
      </div>
      <div id="cartBody" class="flex-1 overflow-y-auto space-y-2 text-xs"></div>
      <button onclick="paystackCheckout()" class="w-full mt-3 bg-orange-600 text-white font-bold py-3 rounded-xl text-xs shadow">
        Pay 30% Deposit via Paystack
      </button>
    </div>
  </div>

  <script>
    const PAYSTACK_PUBLIC_KEY = 'pk_live_96685dc1a36bc585d08a7b5fd4a4891d8bce14cb';[span_0](start_span)[span_0](end_span)
    let selectedCurrency = 'KSh';
    let cart = [];
    let pickedIds = [];

    // Catalog incorporating your uploaded image file + high-def backups
    const catalog = [
      {
        id: 1,
        name: 'Your Uploaded Store Product',
        price: 1500,
        originalPrice: 2500,
        image: 'IMG-20261113-WA0060.jpg',
        fallbackImage: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=600&q=80',
        sizes: ['Standard', 'Large'],
        colors: ['Default']
      },
      {
        id: 2,
        name: '2 in 1 Hot Comb Hair Straightener',
        price: 699,
        originalPrice: 1200,
        image: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=600&q=80',
        fallbackImage: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=600&q=80',
        sizes: ['Standard', 'XL Pro'],
        colors: ['Gold', 'Black']
      },
      {
        id: 3,
        name: 'Vintage Hair Cutting Machine Clipper',
        price: 298,
        originalPrice: 550,
        image: 'https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=600&q=80',
        fallbackImage: 'https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=600&q=80',
        sizes: ['Pro Standard'],
        colors: ['Gold Dragon']
      }
    ];

    function formatPrice(amount) {
      if (selectedCurrency === 'USD') return '$' + (amount * 0.0077).toFixed(2);
      return selectedCurrency + ' ' + amount.toLocaleString();
    }

    function changeCurrency(curr) {
      selectedCurrency = curr;
      renderStore();
    }

    function renderStore() {
      const grid = document.getElementById('productGrid');
      if (!grid) return;

      grid.innerHTML = catalog.map(p => {
        const isPicked = pickedIds.includes(p.id);
        const cardBg = isPicked ? 'bg-white border-gray-200' : 'bg-white border-amber-300 ring-1 ring-amber-200';
        const btnText = isPicked ? '✓ PICKED (Add Again)' : 'Add to Cart';
        const btnClass = isPicked ? 'bg-gray-800 text-white' : 'bg-orange-600 text-white';

        return `
          <div class="rounded-xl shadow-sm p-2 flex flex-col justify-between border ${cardBg}">
            <div>
              <div class="w-full h-36 bg-gray-100 rounded-lg overflow-hidden mb-2">
                <img src="${p.image}" onerror="this.onerror=null; this.src='${p.fallbackImage}';" class="w-full h-full object-cover" />
              </div>
              <p class="text-xs font-black">${formatPrice(p.price)}</p>
              <h3 class="text-[11px] font-semibold text-gray-800 line-clamp-2 mt-0.5">${p.name}</h3>
            </div>
            <div class="mt-2 space-y-1 pt-2 border-t text-[10px]">
              <div class="flex items-center gap-1">
                <span class="font-bold text-gray-500 w-8">Size:</span>
                <select id="size-${p.id}" class="flex-1 p-0.5 border rounded bg-gray-50">
                  ${p.sizes.map(s => `<option value="${s}">${s}</option>`).join('')}
                </select>
              </div>
              <div class="flex items-center gap-1">
                <span class="font-bold text-gray-500 w-8">Qty:</span>
                <input type="number" id="qty-${p.id}" value="1" min="1" max="10" class="flex-1 p-0.5 border rounded text-center font-bold bg-gray-50" />
              </div>
              <button onclick="addToCart(${p.id})" class="w-full mt-1 font-bold py-2 rounded-lg text-xs shadow ${btnClass}">
                ${btnText}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function addToCart(id) {
      const p = catalog.find(item => item.id === id);
      const sizeElem = document.getElementById(`size-${id}`);
      const qtyElem = document.getElementById(`qty-${id}`);
      
      const size = sizeElem ? sizeElem.value : p.sizes[0];
      const qty = qtyElem ? (parseInt(qtyElem.value) || 1) : 1;

      cart.push({ ...p, selectedSize: size, quantity: qty, totalPrice: p.price * qty });
      if (!pickedIds.includes(id)) pickedIds.push(id);

      document.getElementById('cartCount').innerText = cart.length;
      renderStore();
      openCart();
    }

    function openCart() {
      document.getElementById('cartDrawer').classList.remove('hidden');
      const body = document.getElementById('cartBody');
      if (cart.length === 0) {
        body.innerHTML = `<p class="text-center text-gray-500 mt-10">Cart is empty</p>`;
        return;
      }
      body.innerHTML = cart.map((item, idx) => `
        <div class="flex justify-between items-center bg-gray-50 p-2 rounded border">
          <div>
            <p class="font-bold">${item.name} (${item.selectedSize}) x${item.quantity}</p>
            <p class="text-orange-600 font-black">${formatPrice(item.totalPrice)}</p>
          </div>
          <button onclick="cart.splice(${idx},1); openCart(); document.getElementById('cartCount').innerText=cart.length;" class="text-red-600 font-bold">Remove</button>
        </div>
      `).join('');
    }

    function closeCart() {
      document.getElementById('cartDrawer').classList.add('hidden');
    }

    function paystackCheckout() {
      const total = cart.reduce((s, i) => s + i.totalPrice, 0);
      const deposit = Math.round(total * 0.3);

      const handler = window.PaystackPop.setup({
        key: PAYSTACK_PUBLIC_KEY,[span_1](start_span)[span_1](end_span)
        email: 'customer@kili-mall.com',
        amount: deposit * 100,
        currency: 'KES',
        ref: 'KILI-' + Math.floor(Math.random() * 1000000),
        callback: function(res) {
          alert('Deposit successful! Ref: ' + res.reference);
          cart = [];
          pickedIds = [];
          document.getElementById('cartCount').innerText = '0';
          closeCart();
          renderStore();
        }
      });
      handler.openIframe();
    }

    // Initialize store immediately
    renderStore();
  </script>
</body>
</html>
