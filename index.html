<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiliShop | East Africa's Online Store</title>
    <!-- Tailwind CSS for modern mobile-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Paystack Inline JS -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-20">

    <!-- Top Bar -->
    <div class="bg-emerald-700 text-white text-xs py-2 px-4 flex justify-between items-center">
        <span><i class="fa-solid fa-truck-fast mr-1"></i> Fast Delivery across East Africa | Pay via M-Pesa, Airtel & Card</span>
        <button onclick="openAdminModal()" class="underline hover:text-emerald-200">Admin Dashboard</button>
    </div>

    <!-- Header / Navigation -->
    <header class="sticky top-0 z-40 bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="#" class="text-2xl font-black text-emerald-700 tracking-tight">Kili<span class="text-amber-500">Shop</span></a>
            
            <div class="flex-1 max-w-md mx-6 hidden md:block">
                <div class="relative">
                    <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Search thousands of products..." class="w-full bg-gray-100 border border-gray-200 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400"></i>
                </div>
            </div>

            <div class="flex items-center space-x-5">
                <button onclick="openCart()" class="relative text-gray-700 hover:text-emerald-700">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cartBadge" class="absolute -top-2 -right-2 bg-amber-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Categories Strip -->
    <nav class="bg-white border-b border-gray-200 overflow-x-auto whitespace-nowrap px-4 py-2 text-sm">
        <div class="max-w-7xl mx-auto flex space-x-6">
            <button onclick="filterCategory('All')" class="font-medium text-emerald-700 border-b-2 border-emerald-700 pb-1">All Departments</button>
            <button onclick="filterCategory('Electronics')" class="text-gray-600 hover:text-emerald-700 pb-1">Electronics</button>
            <button onclick="filterCategory('Fashion')" class="text-gray-600 hover:text-emerald-700 pb-1">Fashion & Apparel</button>
            <button onclick="filterCategory('Home & Kitchen')" class="text-gray-600 hover:text-emerald-700 pb-1">Home & Kitchen</button>
            <button onclick="filterCategory('Phones & Tablets')" class="text-gray-600 hover:text-emerald-700 pb-1">Phones & Tablets</button>
            <button onclick="filterCategory('Beauty & Health')" class="text-gray-600 hover:text-emerald-700 pb-1">Beauty & Health</button>
        </div>
    </nav>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h1 id="categoryTitle" class="text-xl font-bold text-gray-900">Trending Products</h1>
            <span class="text-xs text-gray-500 font-semibold" id="productCount"></span>
        </div>
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Dynamically populated products -->
        </div>
    </main>

    <!-- Slide-over Cart & Checkout Drawer -->
    <div id="cartDrawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-black bg-opacity-50 transition-opacity" onclick="closeCart()"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white shadow-xl flex flex-col">
                <div class="p-4 border-b border-gray-200 flex items-center justify-between bg-emerald-700 text-white">
                    <h2 class="text-lg font-bold">Your Shopping Cart</h2>
                    <button onclick="closeCart()" class="text-white hover:text-gray-200"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                
                <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <!-- Cart items loaded here -->
                </div>

                <div class="border-t border-gray-200 p-4 bg-gray-50 space-y-3">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-600">Subtotal:</span>
                        <span id="cartSubtotal" class="font-bold">KES 0</span>
                    </div>
                    <div class="flex justify-between text-sm bg-emerald-50 p-2 rounded border border-emerald-200 text-emerald-800">
                        <div>
                            <p class="font-bold">30% Upfront Deposit (Pay Now):</p>
                            <p class="text-xs">Balance 70% paid upon safe delivery</p>
                        </div>
                        <span id="depositAmount" class="font-extrabold text-base">KES 0</span>
                    </div>

                    <div class="space-y-2 pt-2">
                        <input type="text" id="buyerName" placeholder="Full Name" class="w-full p-2 border rounded text-sm bg-white">
                        <input type="email" id="buyerEmail" placeholder="Email Address (required for Paystack)" class="w-full p-2 border rounded text-sm bg-white">
                        <input type="text" id="buyerPhone" placeholder="Mobile Number (e.g., 254712345678)" class="w-full p-2 border rounded text-sm bg-white">
                        <input type="text" id="buyerAddress" placeholder="Delivery Location / Town" class="w-full p-2 border rounded text-sm bg-white">
                    </div>

                    <button onclick="initiatePaystackCheckout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded shadow transition">
                        Pay 30% Deposit via Paystack
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard Modal -->
    <div id="adminModal" class="fixed inset-0 z-50 overflow-y-auto hidden bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-2xl w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-lg font-bold text-gray-900"><i class="fa-solid fa-lock mr-2 text-emerald-700"></i> KiliShop Admin Dashboard</h2>
                <button onclick="closeAdminModal()" class="text-gray-500 hover:text-gray-700"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div>
                <h3 class="text-sm font-semibold text-gray-600 mb-2">Customer Orders Received:</h3>
                <div id="adminOrdersList" class="space-y-3 max-h-96 overflow-y-auto">
                    <!-- Orders populate here -->
                </div>
            </div>
            <div class="flex justify-end pt-3 border-t">
                <button onclick="closeAdminModal()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded text-sm">Close</button>
            </div>
        </div>
    </div>

    <!-- Application JavaScript -->
    <script>
        // Live Paystack Public Key
        const PAYSTACK_PUBLIC_KEY = 'pk_live_96685dc1a36bc585d08a7b5fd4a4891d8bce14cb';

        // Verified Product Database with accurate matching descriptions & images
        const products = [
            { id: 1, name: "Smart Watch Ultra Series 8", category: "Electronics", price: 3500, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" },
            { id: 2, name: "Wireless Bluetooth Earbuds Pro", category: "Electronics", price: 1800, image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500" },
            { id: 3, name: "Men's Casual Running Sneakers", category: "Fashion", price: 2800, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" },
            { id: 4, name: "Non-Stick 7-Piece Cookware Set", category: "Home & Kitchen", price: 6500, image: "https://images.unsplash.com/photo-1584990347426-c585c6489453?w=500" },
            { id: 5, name: "Android 4G Smartphone 6.5\"", category: "Phones & Tablets", price: 12500, image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" },
            { id: 6, name: "Ionic Facial Steamer & Cleanser", category: "Beauty & Health", price: 2400, image: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=500" },
            { id: 7, name: "Smart Android LED TV 43-inch", category: "Electronics", price: 22999, image: "https://images.unsplash.com/photo-1593305841991-05c297ba4575?w=500" },
            { id: 8, name: "HP Core i5 14-inch Laptop", category: "Phones & Tablets", price: 34500, image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500" },
            { id: 9, name: "Women's Designer Leather Handbag", category: "Fashion", price: 2100, image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500" },
            { id: 10, name: "Stainless Steel Electric Kettle 2L", category: "Home & Kitchen", price: 1450, image: "https://images.unsplash.com/photo-1594897030264-ab7d49efc873?w=500" },
            { id: 11, name: "Deep Tissue Muscle Massage Gun", category: "Beauty & Health", price: 2850, image: "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=500" },
            { id: 12, name: "Bluetooth Home Theater Subwoofer", category: "Electronics", price: 4999, image: "https://images.unsplash.com/photo-1545454675-3531b543be5d?w=500" }
        ];

        let cart = [];
        let orders = JSON.parse(localStorage.getItem('kilishop_orders') || '[]');

        function renderProducts(itemsToRender) {
            const grid = document.getElementById('productGrid');
            document.getElementById('productCount').innerText = `Showing ${itemsToRender.length} items`;
            
            grid.innerHTML = itemsToRender.map(p => `
                <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                    <div class="h-48 overflow-hidden bg-gray-100 relative">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="text-xs text-emerald-600 font-semibold uppercase tracking-wider">${p.category}</span>
                            <h3 class="text-sm font-bold text-gray-800 line-clamp-1 mt-0.5">${p.name}</h3>
                            <p class="text-base font-extrabold text-emerald-700 mt-1">KES ${p.price.toLocaleString()}</p>
                        </div>
                        <div class="mt-3 pt-2 border-t border-gray-100 flex items-center justify-between">
                            <span class="text-xs text-gray-500">Deposit: KES ${Math.round(p.price * 0.3).toLocaleString()}</span>
                            <button onclick="addToCart(${p.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded transition">
                                <i class="fa-solid fa-plus mr-1"></i> Add
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            document.getElementById('categoryTitle').innerText = cat === 'All' ? 'Trending Products' : cat;
            if (cat === 'All') {
                renderProducts(products);
            } else {
                renderProducts(products.filter(p => p.category === cat));
            }
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
            openCart();
        }

        function updateCartUI() {
            const badge = document.getElementById('cartBadge');
            const container = document.getElementById('cartItemsContainer');
            const subtotalEl = document.getElementById('cartSubtotal');
            const depositEl = document.getElementById('depositAmount');

            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            badge.innerText = totalItems;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center py-8 text-sm">Your cart is empty.</p>`;
                subtotalEl.innerText = 'KES 0';
                depositEl.innerText = 'KES 0';
                return;
            }

            let subtotal = 0;
            container.innerHTML = cart.map(item => {
                subtotal += item.price * item.qty;
                return `
                    <div class="flex items-center justify-between bg-gray-50 p-2 rounded border">
                        <div class="flex-1">
                            <h4 class="text-sm font-bold text-gray-800">${item.name}</h4>
                            <p class="text-xs text-gray-500">KES ${item.price.toLocaleString()} x ${item.qty}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-gray-200 rounded text-xs font-bold">-</button>
                            <span class="text-sm font-semibold">${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-gray-200 rounded text-xs font-bold">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            subtotalEl.innerText = `KES ${subtotal.toLocaleString()}`;
            const deposit = Math.round(subtotal * 0.3);
            depositEl.innerText = `KES ${deposit.toLocaleString()}`;
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCartUI();
        }

        function openCart() { document.getElementById('cartDrawer').classList.remove('hidden'); }
        function closeCart() { document.getElementById('cartDrawer').classList.add('hidden'); }

        function openAdminModal() {
            const list = document.getElementById('adminOrdersList');
            if (orders.length === 0) {
                list.innerHTML = `<p class="text-sm text-gray-500">No orders recorded yet.</p>`;
            } else {
                list.innerHTML = orders.map(o => `
                    <div class="bg-gray-50 p-3 rounded border text-sm space-y-1">
                        <div class="flex justify-between font-bold text-gray-800">
                            <span>Order #${o.reference}</span>
                            <span class="text-emerald-600">Paid Deposit: KES ${o.depositAmount.toLocaleString()}</span>
                        </div>
                        <p class="text-xs text-gray-600"><strong class="text-gray-700">Customer:</strong> ${o.name} (${o.email} / ${o.phone})</p>
                        <p class="text-xs text-gray-600"><strong class="text-gray-700">Location:</strong> ${o.address}</p>
                        <p class="text-xs text-gray-500">Balance due on delivery (70%): KES ${o.balanceDue.toLocaleString()}</p>
                    </div>
                `).join('');
            }
            document.getElementById('adminModal').classList.remove('hidden');
        }
        function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }

        function initiatePaystackCheckout() {
            const name = document.getElementById('buyerName').value.trim();
            const email = document.getElementById('buyerEmail').value.trim();
            const phone = document.getElementById('buyerPhone').value.trim();
            const address = document.getElementById('buyerAddress').value.trim();

            if (!name || !email || !phone || !address) {
                alert('Please fill in your name, email address, mobile number, and delivery location.');
                return;
            }

            if (cart.length === 0) {
                alert('Your cart is empty.');
                return;
            }

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const depositAmount = Math.round(subtotal * 0.3); // 30% upfront
            const balanceDue = subtotal - depositAmount;
            const reference = 'KS-' + Math.floor(Math.random() * 900000 + 100000);

            let handler = PaystackPop.setup({
                key: PAYSTACK_PUBLIC_KEY,
                email: email,
                amount: depositAmount * 100, // Paystack expects amount in minor units (cents / kobo)
                currency: 'KES',
                ref: reference,
                metadata: {
                    custom_fields: [
                        { display_name: "Customer Name", variable_name: "customer_name", value: name },
                        { display_name: "Phone Number", variable_name: "phone_number", value: phone },
                        { display_name: "Delivery Address", variable_name: "delivery_address", value: address },
                        { display_name: "Order Type", variable_name: "order_type", value: "30% Deposit (70% Balance on Delivery)" }
                    ]
                },
                callback: function(response) {
                    alert('Deposit payment successful! Reference: ' + response.reference);
                    
                    // Save order in admin list
                    orders.push({
                        reference: response.reference,
                        name: name,
                        email: email,
                        phone: phone,
                        address: address,
                        subtotal: subtotal,
                        depositAmount: depositAmount,
                        balanceDue: balanceDue,
                        items: [...cart],
                        date: new Date().toLocaleString()
                    });
                    localStorage.setItem('kilishop_orders', JSON.stringify(orders));

                    // Reset cart
                    cart = [];
                    updateCartUI();
                    closeCart();
                },
                onClose: function() {
                    alert('Transaction was not completed.');
                }
            });

            handler.openIframe();
        }

        // Initial render on load
        renderProducts(products);
    </script>
</body>
</html>
