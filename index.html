        // 7. Health & Beauty
        { id: 701, name: 'Hydrating Vitamin C Face Serum 50ml', category: 'Health & Beauty', price: 3500, originalPrice: 4800, discount: '27% OFF', image: 'https://images.pexels.com/photos/3685530/pexels-photo-3685530.jpeg?auto=compress&cs=tinysrgb&w=600' },
        { id: 702, name: 'Daily Moisturizing Facial Cleanser', category: 'Health & Beauty', price: 2700, originalPrice: 3800, discount: '29% OFF', image: 'https://images.pexels.com/photos/3735657/pexels-photo-3735657.jpeg?auto=compress&cs=tinysrgb&w=600' },

        // 8. Baby Products
        { id: 801, name: 'Soft Baby Diapers Jumbo Pack (64 Count)', category: 'Baby Products', price: 2100, originalPrice: 2800, discount: '25% OFF', image: 'https://images.pexels.com/photos/3662667/pexels-photo-3662667.jpeg?auto=compress&cs=tinysrgb&w=600' },
        { id: 802, name: 'Gentle Baby Bedtime Lotion 500ml', category: 'Baby Products', price: 700, originalPrice: 1000, discount: '30% OFF', image: 'https://images.pexels.com/photos/3933275/pexels-photo-3933275.jpeg?auto=compress&cs=tinysrgb&w=600' },
        { id: 803, name: 'Foldable Lightweight Baby Stroller', category: 'Baby Products', price: 9500, originalPrice: 13000, discount: '27% OFF', image: 'https://images.pexels.com/photos/3661350/pexels-photo-3661350.jpeg?auto=compress&cs=tinysrgb&w=600' },

      ], []);

      const formatPrice = (amountInKsh) => {
        const config = currencyRates[selectedCurrency] || currencyRates.KSh;
        const converted = amountInKsh * config.rate;
        if (selectedCurrency === 'USD') {
          return `${config.symbol}${converted.toFixed(2)}`;
        }
        return `${config.symbol}${Math.round(converted).toLocaleString()}`;
      };

      const filteredProducts = useMemo(() => {
        return masterCatalog.filter((product) => {
          const matchesCategory = selectedCategory === 'All' || product.category === selectedCategory;
          const matchesSearch =
            product.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            product.category.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });
      }, [masterCatalog, selectedCategory, searchQuery]);

      const addToCart = (product) => {
        setCart((prev) => [...prev, product]);
      };

      const removeFromCart = (index) => {
        setCart((prev) => prev.filter((_, i) => i !== index));
      };

      const cartTotalKsh = cart.reduce((sum, item) => sum + item.price, 0);
      const depositAmountKsh = Math.round(cartTotalKsh * 0.3);
      const balanceOnDeliveryKsh = cartTotalKsh - depositAmountKsh;

      const handlePaymentSubmit = (e) => {
        e.preventDefault();
        setIsProcessing(true);
        setTimeout(() => {
          setIsProcessing(false);
          setCheckoutStep('success');
          setCart([]);
        }, 2000);
      };

      // Downward-scrolling category sections when viewing "All"

                  <h2 className="text-lg font-black text-gray-800">
                    {checkoutStep === 'cart' && `Shopping Cart (${cart.length})`}
                    {checkoutStep === 'checkout' && 'East Africa 30% Deposit Payment'}
                    {checkoutStep === 'success' && 'Order Confirmed!'}
                  </h2>
                  <button
                    onClick={() => {
                      setIsCartOpen(false);
                      setCheckoutStep('cart');
                    }}
                    className="text-gray-400 hover:text-gray-700 text-xl font-bold"
                  >
                    ✕
                  </button>
                </div>

                {/* STEP 1: CART */}
                {checkoutStep === 'cart' && (
                  <>
                    {cart.length === 0 ? (
                      <div className="flex-1 flex flex-col items-center justify-center text-center text-gray-500">
                        <p className="text-base font-bold">Your cart is empty</p>
                        <p className="text-xs mt-1">Select any discounted item across East Africa to start.</p>
                      </div>
                    ) : (
                      <>
                        <div className="flex-1 space-y-3 overflow-y-auto pr-1">
                          {cart.map((item, index) => (
                            <div
                              key={index}
                              className="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl border border-gray-200"
                            >
                              <div className="flex items-center gap-3">
                                <img
                                  src={item.image}
                                  alt={item.name}
                                  onError={(e) => {
                                    e.target.onerror = null;
                                    e.target.src = getFallbackImage(item.name);
                                  }}
                                  className="w-12 h-12 object-cover rounded-lg"
                                />
                                <div>
                                  <h4 className="text-xs font-bold text-gray-800 line-clamp-1">{item.name}</h4>
                                  <p className="text-xs text-orange-600 font-black mt-0.5">{formatPrice(item.price)}</p>
                                </div>
                              </div>
                              <button
                                onClick={() => removeFromCart(index)}
                                className="text-red-600 hover:text-red-800 text-xs font-bold px-2 py-1"
                              >
                                Remove
                              </button>
                            </div>
                          ))}
                        </div>

                        <div className="border-t pt-3 mt-4 bg-orange-50 p-3.5 rounded-xl space-y-1.5">
                          <div className="flex justify-between text-xs text-gray-700 font-bold">
                            <span>Total Goods Value:</span>
                            <span>{formatPrice(cartTotalKsh)}</span>
                          </div>
                          <div className="flex justify-between text-xs text-green-700 font-black">
                            <span>Pay 30% Deposit Now:</span>
                            <span>{formatPrice(depositAmountKsh)}</span>
                          </div>
                          <div className="flex justify-between text-xs text-orange-800 font-black border-t border-orange-200 pt-1.5">
                            <span>Pay 70% Balance After Delivery:</span>
                            <span>{formatPrice(balanceOnDeliveryKsh)}</span>
                          </div>
                        </div>

                        <button
                          onClick={() => setCheckoutStep('checkout')}
                          className="w-full mt-4 bg-orange-600 text-white font-bold py-3 rounded-xl hover:bg-orange-700 transition shadow"
                        >
                          Proceed to East Africa Checkout
                        </button>
                      </>
                    )}
                  </>
                )}

                {/* STEP 2: CHECKOUT */}
                {checkoutStep === 'checkout' && (
                  <form onSubmit={handlePaymentSubmit} className="flex-1 flex flex-col justify-between space-y-3">
                    <div className="space-y-3">
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">Full Name</label>
                        <input
                          type="text"
                          required
                          placeholder="Enter full name"
                          value={customerName}
                          onChange={(e) => setCustomerName(e.target.value)}
                          className="w-full p-2.5 text-sm border rounded-lg focus:outline-none focus:border-orange-600"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-xs font-bold text-gray-700 mb-1">East Africa Country</label>
                          <select
                            value={destinationCountry}
                            onChange={(e) => setDestinationCountry(e.target.value)}
                            className="w-full p-2.5 text-sm border rounded-lg bg-white focus:outline-none focus:border-orange-600"
                          >
                            <option value="Kenya">🇰🇪 Kenya</option>
                            <option value="Uganda">🇺🇬 Uganda</option>
                            <option value="Tanzania">🇹🇿 Tanzania</option>
                            <option value="Rwanda">🇷🇼 Rwanda</option>
                            <option value="Burundi">🇧🇮 Burundi</option>
                            <option value="South Sudan">🇸🇸 South Sudan</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-gray-700 mb-1">Currency</label>
                          <select
                            value={selectedCurrency}
                            onChange={(e) => setSelectedCurrency(e.target.value)}
                            className="w-full p-2.5 text-sm border rounded-lg bg-white focus:outline-none focus:border-orange-600"
                          >
                            {Object.entries(currencyRates).map(([code, info]) => (
                              <option key={code} value={code}>{info.label}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-xs font-bold text-gray-700 mb-1">Phone Number</label>
                          <input
                            type="tel"
                            required
                            placeholder="+254 / +256 / +255..."
                            value={phoneNumber}
                            onChange={(e) => setPhoneNumber(e.target.value)}
                            className="w-full p-2.5 text-sm border rounded-lg focus:outline-none focus:border-orange-600"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-gray-700 mb-1">Email Address</label>
                          <input
                            type="email"
                            required
                            placeholder="you@email.com"
                            value={customerEmail}
                            onChange={(e) => setCustomerEmail(e.target.value)}
                            className="w-full p-2.5 text-sm border rounded-lg focus:outline-none focus:border-orange-600"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">City & Delivery Point</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Nairobi, Kampala, Dar es Salaam, Kigali"
                          value={shippingAddress}
                          onChange={(e) => setShippingAddress(e.target.value)}
                          className="w-full p-2.5 text-sm border rounded-lg focus:outline-none focus:border-orange-600"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1.5">
                          Payment Method (All African Money & USD)
                        </label>
                        <div className="grid grid-cols-3 gap-2">
                          <button
                            type="button"
                            onClick={() => setPaymentMethod('mpesa')}
                            className={`p-2 rounded-xl border text-[11px] font-bold text-center ${
                              paymentMethod === 'mpesa'
                                ? 'border-green-600 bg-green-50 text-green-700'
                                : 'border-gray-200 text-gray-600'
                            }`}
                          >
                            📱 M-Pesa / MTN / Airtel Money
                          </button>
                          <button
                            type="button"
                            onClick={() => setPaymentMethod('paystack')}
                            className={`p-2 rounded-xl border text-[11px] font-bold text-center ${
                              paymentMethod === 'paystack'
                                ? 'border-blue-600 bg-blue-50 text-blue-700'
                                : 'border-gray-200 text-gray-600'
                            }`}
                          >
                            💳 Paystack (African Currencies)
                          </button>
                          <button
                            type="button"
                            onClick={() => setPaymentMethod('usd')}
                            className={`p-2 rounded-xl border text-[11px] font-bold text-center ${
                              paymentMethod === 'usd'
                                ? 'border-purple-600 bg-purple-50 text-purple-700'
                                : 'border-gray-200 text-gray-600'
                            }`}
                          >
                            💵 USD Visa / Mastercard
                          </button>
                        </div>
                      </div>

                      <div className="bg-gray-50 p-3 rounded-lg border text-xs space-y-1">
                        <div className="flex justify-between font-bold text-green-700">
                          <span>30% Deposit Due Now:</span>
                          <span>{formatPrice(depositAmountKsh)}</span>
                        </div>
                        <div className="flex justify-between font-bold text-orange-700">
                          <span>70% Balance After Delivery ({destinationCountry}):</span>
                          <span>{formatPrice(balanceOnDeliveryKsh)}</span>
                        </div>
                      </div>
                    </div>

                    <div className="border-t pt-3 flex gap-2">
                      <button
                        type="button"
                        onClick={() => setCheckoutStep('cart')}
                        className="w-1/3 bg-gray-200 text-gray-800 font-bold py-3 rounded-xl hover:bg-gray-300 text-sm"
                      >
                        Back
                      </button>
                      <button
                        type="submit"
                        disabled={isProcessing}
                        className="w-2/3 bg-orange-600 text-white font-bold py-3 rounded-xl hover:bg-orange-700 shadow text-sm"
                      >
                        {isProcessing ? 'Processing...' : `Pay 30% (${formatPrice(depositAmountKsh)})`}
                      </button>
                    </div>
                  </form>
                )}

                {/* STEP 3: SUCCESS */}
                {checkoutStep === 'success' && (
                  <div className="flex-1 flex flex-col items-center justify-center text-center">
                    <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-3xl font-bold mb-4">
                      ✓
                    </div>
                    <h3 className="text-xl font-black text-gray-800 mb-1">30% Deposit Received!</h3>
                    <p className="text-xs text-gray-600 max-w-xs mb-4">
                      Thank you, <span className="font-bold">{customerName}</span>. Your order is scheduled for East Africa courier dispatch to <span className="font-bold text-orange-600">{destinationCountry}</span> ({shippingAddress}).
                    </p>
                    <div className="bg-orange-50 p-3 rounded-xl border border-orange-200 text-xs text-orange-900 mb-6 w-full">
                      <span className="font-bold">Balance Due After Delivery:</span> {formatPrice(balanceOnDeliveryKsh)}
                    </div>
                    <button
                      onClick={() => {
                        setIsCartOpen(false);
                        setCheckoutStep('cart');
                      }}
                      className="w-full bg-orange-600 text-white font-bold py-3 rounded-xl hover:bg-orange-700 text-sm"
                    >
                      Continue Shopping
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<JumiaKilimallStorefront />);
  </script>
</body>
</html>
